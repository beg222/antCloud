<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="antcloud-stack-title antcloud-stack-desc">
  <title id="antcloud-stack-title">蚂蚁项目管理系统技术选型分层图</title>
  <desc id="antcloud-stack-desc">自接入层到运行环境共六层，L5 至 L3 为本仓库自研代码，L2 至 L0 为直接引用的组件，每层标注承担职责与选用技术。</desc><style type="text/css"><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');]]></style>

  <style>
    .eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;font-weight:500;letter-spacing:.2em;fill:#6b7c96}
    .h1{font-family:'Instrument Serif','Noto Serif SC',serif;font-size:24px;font-weight:400;letter-spacing:.01em;fill:#16233b}
    .meta{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;font-weight:400;letter-spacing:.1em;fill:#6b7c96}
    .lno{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;font-weight:500;letter-spacing:.12em;fill:#8a99ad}
    .lname{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:13px;font-weight:600;fill:#16233b}
    .role{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:9.5px;font-weight:400;fill:#5a6b85}
    .tech{font-family:'Geist Mono','Noto Sans SC',ui-monospace,monospace;font-size:9.5px;font-weight:400;fill:#16233b;fill-opacity:.82}
    .foot{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:8.5px;font-weight:400;fill:#8a99ad}
  </style>

  <defs>
    <linearGradient id="depth" x1="0" y1="150" x2="0" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233b" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#16233b" stop-opacity="0.075"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="580" fill="#f7f8fa"/>
  <rect x="124" y="150" width="828" height="360" fill="url(#depth)"/>

  <text class="eyebrow" x="48" y="50">TECH STACK · 技术选型</text>
  <text class="meta" x="952" y="50" text-anchor="end">SPRING CLOUD ALIBABA 2021.0.5.0</text>
  <text class="meta" x="952" y="66" text-anchor="end">JDK 8 · SPRING BOOT 2.7.18</text>
  <text class="h1" x="48" y="86">六层技术栈，每一层只解决一件事</text>
  <line x1="48" y1="110" x2="952" y2="110" stroke="#16233b" stroke-opacity="0.14"/>

  <!-- ── stratum rules ────────────────────────────────────── -->
  <line x1="124" y1="150" x2="952" y2="150" stroke="#16233b" stroke-opacity="0.22"/>
  <line x1="124" y1="210" x2="952" y2="210" stroke="#16233b" stroke-opacity="0.10"/>
  <line x1="124" y1="270" x2="952" y2="270" stroke="#16233b" stroke-opacity="0.10"/>
  <line x1="124" y1="390" x2="952" y2="390" stroke="#16233b" stroke-opacity="0.10"/>
  <line x1="124" y1="450" x2="952" y2="450" stroke="#16233b" stroke-opacity="0.10"/>
  <line x1="124" y1="510" x2="952" y2="510" stroke="#16233b" stroke-opacity="0.22"/>

  <!-- self-built / referenced divider -->
  <line x1="48" y1="330" x2="952" y2="330" stroke="#1557ae" stroke-width="2"/>

  <!-- tier spine -->
  <line x1="104" y1="150" x2="104" y2="510" stroke="#16233b" stroke-opacity="0.14"/>

  <!-- ── L5 接入层 ────────────────────────────────────────── -->
  <text class="lno" x="88" y="185" text-anchor="end">L5</text>
  <text class="lname" x="124" y="185">接入层</text>
  <text class="role" x="320" y="185">组件生态成熟，表单表格开箱可用</text>
  <text class="tech" x="620" y="185">Vue 2 · Element UI 2.15.10 · webpack 4</text>

  <!-- ── L4 网关层 ────────────────────────────────────────── -->
  <text class="lno" x="88" y="245" text-anchor="end">L4</text>
  <text class="lname" x="124" y="245">网关层</text>
  <text class="role" x="320" y="245">鉴权、限流、跨域都收在这一层</text>
  <text class="tech" x="620" y="245">Spring Cloud Gateway · Sentinel</text>

  <!-- ── L3 应用层 ────────────────────────────────────────── -->
  <text class="lno" x="88" y="305" text-anchor="end">L3</text>
  <text class="lname" x="124" y="305">应用层</text>
  <text class="role" x="320" y="305">业务逻辑所在，各服务独立部署</text>
  <text class="tech" x="620" y="305">Spring Boot 2.7.18 · Spring Cloud 2021.0.8 · OpenFeign</text>

  <!-- ── L2 数据层 ────────────────────────────────────────── -->
  <text class="lno" x="88" y="365" text-anchor="end">L2</text>
  <text class="lname" x="124" y="365">数据层</text>
  <text class="role" x="320" y="365">关系建模，连接池与慢 SQL 监控</text>
  <text class="tech" x="620" y="365">MySQL 8.0 · MyBatis-Plus · Druid 1.2.20</text>

  <!-- ── L1 中间件 ────────────────────────────────────────── -->
  <text class="lno" x="88" y="425" text-anchor="end">L1</text>
  <text class="lname" x="124" y="425">中间件</text>
  <text class="role" x="320" y="425">注册配置、分布式事务、消息与缓存</text>
  <text class="tech" x="620" y="425">Nacos 2.2.3 · Seata 1.6.1 · RocketMQ 5.1 · Redis 7</text>

  <!-- ── L0 运行环境 ──────────────────────────────────────── -->
  <text class="lno" x="88" y="485" text-anchor="end">L0</text>
  <text class="lname" x="124" y="485">运行环境</text>
  <text class="role" x="320" y="485">容器化交付，本地与服务器同一套镜像</text>
  <text class="tech" x="620" y="485">JDK 8 · Maven 3.9 · Docker · Linux</text>

  <!-- ── footer ───────────────────────────────────────────── -->
  <text class="foot" x="48" y="546">L5–L3 是本仓库自己写的代码，L2–L0 是直接引用的组件；层与层只通过标准协议或接口交互，任何一层都可以单独替换。</text>
  <text class="meta" x="952" y="546" text-anchor="end" fill="#a8b4c4">FIG. 2 — antCloud · 2026</text>
</svg>
