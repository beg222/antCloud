<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="antcloud-stack-title antcloud-stack-desc">
        <title id="antcloud-stack-title">蚂蚁项目管理技术选型分层图</title>
        <desc id="antcloud-stack-desc">技术栈自底向上分为运行环境、中间件、数据层、应用层、网关层、接入层六层，每层标注所选技术与其承担职责。</desc><style type="text/css"><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');]]></style>

        <style>
          .idx  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.1em; fill: #6b7c96; }
          .name { font-family: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-size: 14px; font-weight: 600; fill: #16233b; }
          .why  { font-family: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-size: 10px; fill: #5a6b85; }
          .tech { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #5a6b85; }
          .dir  { font-family: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #6b7c96; }
          .foot { font-family: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-size: 10px; fill: #5a6b85; }
        </style>

        <rect width="100%" height="100%" fill="#f7f8fa"/>

        <text class="dir" x="56" y="90">抽象层级</text>
        <path d="M86,100 V116" fill="none" stroke="#6b7c96" stroke-width="1"/>
        <path d="M82,112 L86,120 L90,112" fill="none" stroke="#6b7c96" stroke-width="1"/>

        <!-- L5 接入层 -->
        <rect x="140" y="96" width="740" height="64" rx="6" fill="#ffffff" stroke="#16233b" stroke-width="1"/>
        <text class="idx" x="156" y="132">L5</text>
        <text class="name" x="196" y="132">接入层</text>
        <text class="why" x="196" y="150">组件生态成熟，适配后台管理</text>
        <text class="tech" x="856" y="132" text-anchor="end">Vue 2 · Element UI · webpack 4</text>

        <!-- L4 网关层 -->
        <rect x="140" y="168" width="740" height="64" rx="6" fill="#eef1f7" stroke="#16233b" stroke-width="1"/>
        <text class="idx" x="156" y="204">L4</text>
        <text class="name" x="196" y="204">网关层</text>
        <text class="why" x="196" y="222">统一入口，鉴权与限流</text>
        <text class="tech" x="856" y="204" text-anchor="end">Spring Cloud Gateway · Sentinel</text>

        <!-- L3 应用层 focal -->
        <rect x="140" y="240" width="740" height="64" rx="6" fill="rgba(21,87,174,0.08)" stroke="#1557ae" stroke-width="1.2"/>
        <text class="idx" x="156" y="276" fill="#1557ae">L3</text>
        <text class="name" x="196" y="276">应用层</text>
        <text class="why" x="196" y="294">标准微服务栈，声明式调用</text>
        <text class="tech" x="856" y="276" text-anchor="end" fill="#1557ae">Spring Boot 2.7 · Spring Cloud 2021 · OpenFeign</text>

        <!-- L2 数据层 -->
        <rect x="140" y="312" width="740" height="64" rx="6" fill="#ffffff" stroke="#16233b" stroke-width="1"/>
        <text class="idx" x="156" y="348">L2</text>
        <text class="name" x="196" y="348">数据层</text>
        <text class="why" x="196" y="366">关系建模与连接池监控</text>
        <text class="tech" x="856" y="348" text-anchor="end">MySQL 8 · MyBatis · Druid</text>

        <!-- L1 中间件 -->
        <rect x="140" y="384" width="740" height="64" rx="6" fill="#eef1f7" stroke="#16233b" stroke-width="1"/>
        <text class="idx" x="156" y="420">L1</text>
        <text class="name" x="196" y="420">中间件</text>
        <text class="why" x="196" y="438">注册配置、事务与消息</text>
        <text class="tech" x="856" y="420" text-anchor="end">Nacos · Seata · RocketMQ · Redis</text>

        <!-- L0 运行环境 -->
        <rect x="140" y="456" width="740" height="64" rx="6" fill="#ffffff" stroke="#16233b" stroke-width="1"/>
        <text class="idx" x="156" y="492">L0</text>
        <text class="name" x="196" y="492">运行环境</text>
        <text class="why" x="196" y="510">容器化交付，环境一致</text>
        <text class="tech" x="856" y="492" text-anchor="end">Docker · JDK 1.8+ · Linux</text>

        <text class="foot" x="56" y="572">选型原则：每一层只解决一类问题，层与层之间通过标准协议或接口交互，任何一层都可以单独替换。</text>
      </svg>
