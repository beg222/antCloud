<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="antcloud-architecture-title antcloud-architecture-desc">
  <title id="antcloud-architecture-title">蚂蚁项目管理系统架构图</title>
  <desc id="antcloud-architecture-desc">浏览器经统一网关的鉴权过滤链进入认证、系统、项目、流程四个微服务，四个服务共享 Nacos、Seata、RocketMQ、Redis 中间件，各自使用独立的 MySQL 业务库。</desc><style type="text/css"><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');]]></style>

  <style>
    .eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;font-weight:500;letter-spacing:.2em;fill:#6b7c96}
    .h1{font-family:'Instrument Serif','Noto Serif SC',serif;font-size:24px;font-weight:400;letter-spacing:.01em;fill:#16233b}
    .meta{font-family:'Geist Mono',ui-monospace,monospace;font-size:8px;font-weight:400;letter-spacing:.1em;fill:#6b7c96}
    .tnum{font-family:'Geist Mono',ui-monospace,monospace;font-size:7.5px;font-weight:500;letter-spacing:.12em;fill:#8a99ad}
    .tname{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:11px;font-weight:500;fill:#5a6b85}
    .tag{font-family:'Geist Mono',ui-monospace,monospace;font-size:7px;font-weight:500;letter-spacing:.16em;fill:#6b7c96}
    .node{font-family:'Geist','Noto Sans SC','Microsoft YaHei',sans-serif;font-size:13px;font-weight:600;fill:#16233b}
    .mod{font-family:'Geist Mono',ui-monospace,monospace;font-size:8.5px;font-weight:400;fill:#5a6b85}
    .port{font-family:'Geist Mono',ui-monospace,monospace;font-size:9px;font-weight:500;fill:#5a6b85}
    .portbig{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:500;fill:#16233b;fill-opacity:.8}
    .chain{font-family:'Geist Mono','Noto Sans SC',ui-monospace,monospace;font-size:9px;font-weight:400;fill:#3a4a63}
    .chain-a{font-family:'Geist Mono',ui-monospace,monospace;font-size:9px;font-weight:600;fill:#1557ae}
    .note{font-family:'Geist','Noto Sans SC','Microsoft YaHei',sans-serif;font-size:9px;font-weight:400;fill:#5a6b85}
    .spec-n{font-family:'Geist Mono',ui-monospace,monospace;font-size:9px;font-weight:500;fill:#16233b;fill-opacity:.85}
    .spec-r{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:9px;font-weight:400;fill:#5a6b85}
    .db{font-family:'Geist Mono',ui-monospace,monospace;font-size:8.5px;font-weight:400;fill:#6b7c96}
    .alab{font-family:'Geist Mono',ui-monospace,monospace;font-size:7.5px;font-weight:500;letter-spacing:.08em;fill:#5a6b85}
    .legend{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:8.5px;font-weight:400;fill:#5a6b85}
  </style>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7.4" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#5a6b85"/></marker>
  </defs>

  <rect width="1000" height="720" fill="#f7f8fa"/>

  <!-- ── header ───────────────────────────────────────────── -->
  <text class="eyebrow" x="48" y="50">SYSTEM ARCHITECTURE · 系统架构</text>
  <text class="meta" x="952" y="50" text-anchor="end">SPRING CLOUD ALIBABA 2021.0.5.0</text>
  <text class="meta" x="952" y="66" text-anchor="end">JDK 8 · SPRING BOOT 2.7.18</text>
  <text class="h1" x="48" y="86">一次请求经过的四层结构</text>
  <line x1="48" y1="110" x2="952" y2="110" stroke="#16233b" stroke-opacity="0.14"/>

  <!-- ── tier spine ───────────────────────────────────────── -->
  <line x1="104" y1="152" x2="104" y2="660" stroke="#16233b" stroke-opacity="0.14"/>

  <!-- ── connectors (drawn before boxes) ──────────────────── -->
  <!-- browser → gateway -->
  <rect x="258" y="214" width="66" height="13" fill="#f7f8fa"/>
  <text class="alab" x="262" y="224">HTTPS · REST</text>
  <line x1="250" y1="208" x2="250" y2="246" stroke="#5a6b85" stroke-width="1.1" marker-end="url(#ar)"/>

  <!-- gateway → four services -->
  <line x1="221" y1="332" x2="221" y2="386" stroke="#5a6b85" stroke-width="1.1" marker-end="url(#ar)"/>
  <line x1="431" y1="332" x2="431" y2="386" stroke="#5a6b85" stroke-width="1.1" marker-end="url(#ar)"/>
  <line x1="641" y1="332" x2="641" y2="386" stroke="#5a6b85" stroke-width="1.1" marker-end="url(#ar)"/>
  <line x1="851" y1="332" x2="851" y2="386" stroke="#5a6b85" stroke-width="1.1" marker-end="url(#ar)"/>
  <rect x="229" y="342" width="34" height="12" fill="#f7f8fa"/>
  <text class="alab" x="233" y="351">REST</text>

  <!-- services → infrastructure -->
  <rect x="439" y="514" width="100" height="13" fill="#f7f8fa"/>
  <text class="alab" x="443" y="524">注册 · 配置 · 事务</text>
  <line x1="431" y1="492" x2="431" y2="550" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <rect x="649" y="514" width="94" height="13" fill="#f7f8fa"/>
  <text class="alab" x="653" y="524">MYBATIS · DRUID</text>
  <line x1="641" y1="492" x2="641" y2="550" stroke="#5a6b85" stroke-width="1.1" marker-end="url(#ar)"/>

  <!-- ── 01 client ────────────────────────────────────────── -->
  <text class="tnum" x="88" y="170" text-anchor="end">01</text>
  <text class="tname" x="88" y="186" text-anchor="end">客户端</text>
  <rect x="124" y="152" width="252" height="56" fill="#16233b" fill-opacity="0.045" stroke="#16233b" stroke-opacity="0.30"/>
  <text class="tag" x="138" y="170">BROWSER</text>
  <text class="node" x="138" y="188" font-size="13">管理后台前端</text>
  <text class="mod" x="138" y="201">antcloud-ui · Vue 2 · :8080</text>

  <!-- ── 02 gateway ───────────────────────────────────────── -->
  <text class="tnum" x="88" y="282" text-anchor="end">02</text>
  <text class="tname" x="88" y="298" text-anchor="end">网关</text>
  <rect x="124" y="248" width="824" height="84" fill="#ffffff" stroke="#16233b" stroke-width="1.2"/>
  <text class="node" x="140" y="282" font-size="14">统一网关</text>
  <text class="mod" x="140" y="302">antcloud-gateway</text>
  <line x1="300" y1="266" x2="300" y2="314" stroke="#16233b" stroke-opacity="0.12"/>
  <text class="chain" x="316" y="284"><tspan class="chain-a">AuthFilter</tspan><tspan fill="#8a99ad"> › </tspan>白名单<tspan fill="#8a99ad"> › </tspan>Token 解析<tspan fill="#8a99ad"> › </tspan>Redis 登录态<tspan fill="#8a99ad"> › </tspan>X-User-Id 注入<tspan fill="#8a99ad"> › </tspan>清空 FROM_SOURCE</text>
  <text class="note" x="316" y="306">鉴权只发生在这一层，业务服务直接读请求头，不重复校验。</text>
  <text class="portbig" x="932" y="286" text-anchor="end">:6880</text>
  <text class="tag" x="932" y="302" text-anchor="end" fill="#a8b4c4">PORT</text>

  <!-- ── 03 services ──────────────────────────────────────── -->
  <text class="tnum" x="88" y="422" text-anchor="end">03</text>
  <text class="tname" x="88" y="438" text-anchor="end">微服务</text>

  <rect x="124" y="388" width="194" height="104" fill="#ffffff" stroke="#16233b" stroke-opacity="0.45"/>
  <text class="node" x="138" y="414">认证中心</text>
  <text class="port" x="304" y="414" text-anchor="end">:6800</text>
  <text class="mod" x="138" y="432">antcloud-auth</text>
  <line x1="138" y1="442" x2="304" y2="442" stroke="#16233b" stroke-opacity="0.12"/>
  <text class="mod" x="138" y="460">登录 · 注册 · 令牌</text>
  <text class="mod" x="138" y="478">验证码 · 密码加密</text>

  <rect x="334" y="388" width="194" height="104" fill="#ffffff" stroke="#16233b" stroke-opacity="0.45"/>
  <text class="node" x="348" y="414">系统服务</text>
  <text class="port" x="514" y="414" text-anchor="end">:6801</text>
  <text class="mod" x="348" y="432">antcloud-system</text>
  <line x1="348" y1="442" x2="514" y2="442" stroke="#16233b" stroke-opacity="0.12"/>
  <text class="mod" x="348" y="460">用户 · 角色 · 菜单</text>
  <text class="mod" x="348" y="478">部门 · 字典 · 日志</text>

  <rect x="544" y="388" width="194" height="104" fill="#ffffff" stroke="#16233b" stroke-opacity="0.45"/>
  <text class="node" x="558" y="414">项目服务</text>
  <text class="port" x="724" y="414" text-anchor="end">:6806</text>
  <text class="mod" x="558" y="432">antcloud-project</text>
  <line x1="558" y1="442" x2="724" y2="442" stroke="#16233b" stroke-opacity="0.12"/>
  <text class="mod" x="558" y="460">项目 · 任务 · 需求</text>
  <text class="mod" x="558" y="478">迭代 · 工时 · 附件</text>

  <rect x="754" y="388" width="194" height="104" fill="#ffffff" stroke="#16233b" stroke-opacity="0.45"/>
  <text class="node" x="768" y="414">流程服务</text>
  <text class="port" x="934" y="414" text-anchor="end">:6808</text>
  <text class="mod" x="768" y="432">antcloud-workflow</text>
  <line x1="768" y1="442" x2="934" y2="442" stroke="#16233b" stroke-opacity="0.12"/>
  <text class="mod" x="768" y="460">流程定义 · 实例</text>
  <text class="mod" x="768" y="478">审批 · 抄送 · 委托</text>

  <!-- ── 04 infrastructure ────────────────────────────────── -->
  <text class="tnum" x="88" y="586" text-anchor="end">04</text>
  <text class="tname" x="88" y="602" text-anchor="end">基础设施</text>

  <rect x="124" y="552" width="392" height="108" fill="#16233b" fill-opacity="0.045" stroke="#16233b" stroke-opacity="0.30"/>
  <text class="tag" x="140" y="572" fill="#8a99ad">MIDDLEWARE · 所有服务共享</text>
  <text class="spec-n" x="140" y="594">Nacos 2.2.3</text><text class="spec-r" x="238" y="594">注册与配置中心</text>
  <text class="spec-n" x="140" y="612">Seata 1.6.1</text><text class="spec-r" x="238" y="612">AT 模式分布式事务</text>
  <text class="spec-n" x="140" y="630">RocketMQ 5.1</text><text class="spec-r" x="238" y="630">异步消息 / 延时任务</text>
  <text class="spec-n" x="140" y="648">Redis 7</text><text class="spec-r" x="238" y="648">登录态与热点缓存</text>

  <rect x="536" y="552" width="412" height="108" fill="#16233b" fill-opacity="0.045" stroke="#16233b" stroke-opacity="0.30"/>
  <text class="tag" x="552" y="572" fill="#8a99ad">DATABASE · 每服务独立库</text>
  <text class="spec-n" x="552" y="594">MySQL 8.0</text><text class="spec-r" x="616" y="594">utf8mb4 · InnoDB · :3306</text>
  <text class="db" x="552" y="618">antcloud-system · antcloud-project · antcloud-workflow · antcloud-gen</text>
  <text class="note" x="552" y="644">不跨库 JOIN，跨服务取数走 Feign 接口。</text>

  <!-- ── legend ───────────────────────────────────────────── -->
  <rect x="48" y="674" width="9" height="9" fill="#ffffff" stroke="#16233b" stroke-opacity="0.5"/>
  <text class="legend" x="63" y="683">应用进程</text>
  <rect x="128" y="674" width="9" height="9" fill="#16233b" fill-opacity="0.045" stroke="#16233b" stroke-opacity="0.30"/>
  <text class="legend" x="143" y="683">外部依赖</text>
  <line x1="222" y1="679" x2="244" y2="679" stroke="#5a6b85" stroke-width="1.1" marker-end="url(#ar)"/>
  <text class="legend" x="250" y="683">同步调用</text>
  <line x1="322" y1="679" x2="344" y2="679" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="legend" x="350" y="683">注册 · 配置 · 事务</text>
  <text x="462" y="683" font-family="'Geist Mono',ui-monospace,monospace" font-size="8.5" font-weight="600" fill="#1557ae">AuthFilter</text>
  <text class="legend" x="524" y="683">鉴权唯一入口</text>

  <text class="note" x="48" y="706" fill="#8a99ad" font-size="8.5">监控中心 :6888、代码生成 :6802、定时任务 :6803 按需启动，不参与主链路。</text>
  <text class="meta" x="952" y="706" text-anchor="end" fill="#a8b4c4">FIG. 1 — antCloud · 2026</text>
</svg>
