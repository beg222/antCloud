# Tomcat
server: 
  port: 6808

# Spring
spring: 
  application:
    # 应用名称
    name: antcloud-workflow
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 192.168.88.130:8848
        username: nacos
        password: nacos
      config:
        # 配置中心地址
        server-addr: 192.168.88.130:8848
        username: nacos
        password: nacos
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

# 实时log配置，可在http://localhost:6888/ 监控中心查看实时日志
logging:
  file:
    name: logs/${spring.application.name}/info.log

# RocketMQ：连名字服务器 9876，生产者由 starter 自动装配
rocketmq:
  name-server: 192.168.88.130:9876
  producer:
    group: antcloud-notice-producer
    send-message-timeout: 3000

# 消息提醒
antcloud:
  notice:
    # 打开后本服务会启动消费者（生产环境的消费方只开在这里）
    consumer-enabled: true
    topic: antcloud-notice
    consumer-group: antcloud-notice-consumer
    tag: WX_MESSAGE
  workwx:
    # 没有企业微信账号时保持 false：只记日志、不调企微接口
    enabled: false